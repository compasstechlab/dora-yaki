services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # args:
      #   /* to avoid CORS error, use API_BACKEND instead of VITE_API_BASE */
      #   - VITE_API_BASE=http://localhost:7202/api
    ports:
      - "7201:7201"
    environment:
      - API_BACKEND=http://backend:7202
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=7202
      - ENVIRONMENT=development
      - FUNCTION_TARGET=RunHTTPServer
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-local-dev}
      - DATASTORE_EMULATOR_HOST=datastore-emulator:8081
      # GitHub OAuth App (https://github.com/settings/developers)
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:7202/api/auth/github/callback}
      # Session signing (32+ random bytes; `openssl rand -base64 32`)
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      # Frontend origin used for post-login redirects.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:7201}
      # Shared key for /api/job/* endpoints. Empty means disabled for local dev.
      - JOB_AUTH_KEY=${JOB_AUTH_KEY}
      # Token-at-rest encryption: prefer ENCRYPTION_KMS_KEY in production.
      # Local dev: provide a 32-byte AES-256 key (`openssl rand -base64 32`).
      - ENCRYPTION_KEY_BASE64=${ENCRYPTION_KEY_BASE64}
      # - ENCRYPTION_KMS_KEY=projects/.../locations/.../keyRings/.../cryptoKeys/...
    depends_on:
      - datastore-emulator

  # Datastore emulator (remove `--no-store-on-disk` to persist data)
  datastore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud beta emulators datastore start
      --project=${GCP_PROJECT_ID:-local-dev}
      --host-port=0.0.0.0:8081
      --no-store-on-disk

  # /* if you want to use real Datastore on GCP instead of emulator, use this */
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   environment:
  #     - PORT=7202
